<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Architecture: Garmin to SQLite to analytics to API to dashboard, with an optional local AI summary, driven by Claude Code and this plan" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#131d2e"/></linearGradient><radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3987e5" stop-opacity=".55"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></radialGradient><radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8693a" stop-opacity=".45"/><stop offset="1" stop-color="#e8693a" stop-opacity="0"/></radialGradient><linearGradient id="areaB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3987e5" stop-opacity=".45"/><stop offset="1" stop-color="#3987e5" stop-opacity="0"/></linearGradient><linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0ff"/></linearGradient><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#e8693a"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c4cddb"/></marker></defs>
<rect width="1280" height="440" rx="18" fill="url(#bg)"/><text x="36" y="54" font-size="26" fill="#f2f4f8" font-weight="800" text-anchor="start" >How it fits together</text>
<rect x="36" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#e8693a" stroke-width="2"/><rect x="36" y="120" width="172" height="8" rx="4" fill="#e8693a"/>
<text x="122.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Garmin</text>
<text x="122.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >Personal API</text>
<text x="122.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >+ data export</text>
<line x1="212" y1="182" x2="244" y2="182" stroke="#c4cddb" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="248" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#3987e5" stroke-width="2"/><rect x="248" y="120" width="172" height="8" rx="4" fill="#3987e5"/>
<text x="334.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Incremental sync</text>
<text x="334.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >only what is new</text>
<text x="334.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >rate-limit safe</text>
<line x1="424" y1="182" x2="456" y2="182" stroke="#c4cddb" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="460" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#3987e5" stroke-width="2"/><rect x="460" y="120" width="172" height="8" rx="4" fill="#3987e5"/>
<text x="546.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Local storage</text>
<text x="546.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >SQLite + original</text>
<text x="546.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >FIT files</text>
<line x1="636" y1="182" x2="668" y2="182" stroke="#c4cddb" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="672" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#1fb386" stroke-width="2"/><rect x="672" y="120" width="172" height="8" rx="4" fill="#1fb386"/>
<text x="758.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Analytics</text>
<text x="758.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >power · load · wear</text>
<text x="758.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >radar · recovery</text>
<line x1="848" y1="182" x2="880" y2="182" stroke="#c4cddb" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="884" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#3987e5" stroke-width="2"/><rect x="884" y="120" width="172" height="8" rx="4" fill="#3987e5"/>
<text x="970.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >FastAPI</text>
<text x="970.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >JSON endpoints</text>
<text x="970.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >sync on open</text>
<line x1="1060" y1="182" x2="1092" y2="182" stroke="#c4cddb" stroke-width="2.4" marker-end="url(#arr)"/>
<rect x="1096" y="120" width="172" height="124" rx="16" fill="#172334" stroke="#e8693a" stroke-width="2"/><rect x="1096" y="120" width="172" height="8" rx="4" fill="#e8693a"/>
<text x="1182.0" y="168" font-size="18" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Dashboard</text>
<text x="1182.0" y="198" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >React · Recharts</text>
<text x="1182.0" y="218" font-size="14" fill="#c4cddb" font-weight="400" text-anchor="middle" >light and dark themes</text>
<rect x="860" y="30" width="384" height="66" rx="14" fill="#172334" stroke="#b07cf0" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1052.0" y="56" font-size="16" fill="#f2f4f8" font-weight="700" text-anchor="middle" >Optional: local AI summary</text>
<text x="1052.0" y="78" font-size="13" fill="#c4cddb" font-weight="400" text-anchor="middle" >Ollama on 127.0.0.1 · on demand · off unless you say yes</text>
<line x1="1010" y1="116" x2="1010" y2="100" stroke="#b07cf0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="1022" y="112" font-size="12" fill="#8a97ab" font-weight="400" text-anchor="start" >aggregated numbers only</text>
<rect x="36" y="296" width="1208" height="96" rx="16" fill="none" stroke="#33445f" stroke-dasharray="6 6"/>
<text x="60" y="330" font-size="20" fill="#f2f4f8" font-weight="800" text-anchor="start" >Claude Code + this plan</text><text x="60" y="358" font-size="15" fill="#c4cddb" font-weight="400" text-anchor="start" >reads plan/en or plan/it · asks your preferences first · builds phase by phase · verifies every step on your real data</text>
<text x="60" y="380" font-size="14" fill="#8a97ab" font-weight="400" text-anchor="start" >Nothing leaves your computer except calls to Garmin and the map tiles (OpenStreetMap). The optional AI model runs on your own computer.</text>
<line x1="334.0" y1="296" x2="334.0" y2="248" stroke="#33445f" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arr)"/>
<line x1="546.0" y1="296" x2="546.0" y2="248" stroke="#33445f" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arr)"/>
<line x1="758.0" y1="296" x2="758.0" y2="248" stroke="#33445f" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arr)"/>
<line x1="970.0" y1="296" x2="970.0" y2="248" stroke="#33445f" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arr)"/>
</svg>